name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  LITELLM_MASTER_KEY: sk-test-key-for-ci

jobs:
  # ---------------------------------------------------------------------------
  # Lint and Type Check
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          pip install ruff mypy
          pip install -r requirements.txt
      
      - name: Run ruff
        run: ruff check .
      
      - name: Run mypy
        run: mypy --ignore-missing-imports cli/ evals/ || true

  # ---------------------------------------------------------------------------
  # Unit Tests
  # ---------------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      
      - name: Run unit tests
        run: pytest tests/test_unit.py -v

  # ---------------------------------------------------------------------------
  # Integration Tests (with stub model)
  # ---------------------------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: litellm
          POSTGRES_PASSWORD: litellm
          POSTGRES_DB: litellm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      
      - name: Initialize database
        env:
          DATABASE_URL: postgresql://litellm:litellm@localhost:5432/litellm
        run: |
          pip install asyncpg
          python -c "
          import asyncio
          import asyncpg
          
          async def init():
              conn = await asyncpg.connect('postgresql://litellm:litellm@localhost:5432/litellm')
              with open('db/init.sql') as f:
                  await conn.execute(f.read())
              await conn.close()
          
          asyncio.run(init())
          "
      
      - name: Run integration tests (mock mode)
        env:
          DATABASE_URL: postgresql://litellm:litellm@localhost:5432/litellm
          LITELLM_MASTER_KEY: ${{ env.LITELLM_MASTER_KEY }}
        run: pytest tests/test_integration.py -v -m "not requires_gateway"

  # ---------------------------------------------------------------------------
  # Eval Tests (with real LiteLLM proxy using fake model - zero cost)
  # ---------------------------------------------------------------------------
  evals:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
          pip install 'litellm[proxy]'
      
      - name: Start LiteLLM proxy
        run: |
          # Start real LiteLLM proxy with CI config (mock model, no API keys needed)
          litellm --config config/litellm_config_ci.yaml \
            --host 0.0.0.0 --port 4000 \
            > /tmp/litellm.log 2>&1 &
          LITELLM_PID=$!
          echo "Started LiteLLM proxy with PID $LITELLM_PID"
          
          # Wait for proxy to be ready with proper error detection
          READY=false
          for i in {1..30}; do
            # Check if process is still running
            if ! kill -0 $LITELLM_PID 2>/dev/null; then
              echo "ERROR: LiteLLM process died"
              echo "=== LiteLLM logs ==="
              cat /tmp/litellm.log
              exit 1
            fi
            
            if curl -s http://localhost:4000/health > /dev/null 2>&1; then
              echo "LiteLLM proxy is ready after $i seconds"
              READY=true
              break
            fi
            echo "Waiting for LiteLLM proxy... ($i/30)"
            sleep 1
          done
          
          if [ "$READY" != "true" ]; then
            echo "ERROR: LiteLLM proxy failed to become ready"
            echo "=== LiteLLM logs ==="
            cat /tmp/litellm.log
            exit 1
          fi
      
      - name: Run eval suite
        env:
          GATEWAY_URL: http://localhost:4000
          EVAL_MODEL: fake/echo
        run: |
          pytest evals/test_evals.py -v --eval-mode \
            --gateway-url=http://localhost:4000 \
            --eval-model=fake/echo
      
      - name: Dump LiteLLM logs on failure
        if: failure()
        run: |
          echo "=== LiteLLM proxy logs ==="
          cat /tmp/litellm.log 2>/dev/null || echo "No logs found"

  # ---------------------------------------------------------------------------
  # Docker Build Test
  # ---------------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build dashboard image
        run: docker build -t llm-gateway-dashboard ./dashboard
      
      - name: Verify image
        run: docker images llm-gateway-dashboard
