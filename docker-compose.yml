version: "3.9"

services:
  # PostgreSQL for LiteLLM persistence (keys, spend tracking, team data)
  postgres:
    image: postgres:16-alpine
    container_name: llm-gateway-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - llm-gateway

  # Ollama for zero-cost local inference
  ollama:
    image: ollama/ollama:latest
    container_name: llm-gateway-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm-gateway
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # GPU is optional - will work without it
    profiles:
      - gpu

  # Ollama without GPU (default)
  ollama-cpu:
    image: ollama/ollama:latest
    container_name: llm-gateway-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm-gateway
    profiles:
      - cpu
      - default

  # LiteLLM Proxy - the main gateway
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: llm-gateway-litellm
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm}@postgres:5432/${POSTGRES_DB:-litellm}
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-master-key-change-me}
      LITELLM_LOG: "DEBUG"
      # Provider API keys (optional - leave empty for local-only mode)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      AZURE_API_BASE: ${AZURE_API_BASE:-}
      # Ollama connection
      OLLAMA_API_BASE: http://ollama-cpu:11434
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml:ro
      - ./guardrails:/app/guardrails:ro
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm-gateway

  # Presidio Analyzer for PII detection
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: llm-gateway-presidio-analyzer
    ports:
      - "${PRESIDIO_ANALYZER_PORT:-5001}:3000"
    networks:
      - llm-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Presidio Anonymizer for PII redaction
  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: llm-gateway-presidio-anonymizer
    ports:
      - "${PRESIDIO_ANONYMIZER_PORT:-5002}:3000"
    networks:
      - llm-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dashboard - lightweight observability UI
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: llm-gateway-dashboard
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm}@postgres:5432/${POSTGRES_DB:-litellm}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-master-key-change-me}
      LITELLM_URL: http://litellm:4000
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
    networks:
      - llm-gateway

volumes:
  postgres_data:
  ollama_data:

networks:
  llm-gateway:
    driver: bridge
