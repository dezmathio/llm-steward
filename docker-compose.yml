# LLM Gateway Kit - Docker Compose Configuration
# Uses host networking to avoid container-to-container networking issues

services:
  # PostgreSQL for LiteLLM persistence (keys, spend tracking, team data)
  postgres:
    image: postgres:16-alpine
    container_name: llm-gateway-postgres
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # NOTE: init.sql is NOT mounted here - run it manually after LiteLLM initializes:
      #   docker compose exec -T postgres psql -U litellm -d litellm < db/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ollama for zero-cost local inference (CPU mode, no GPU required)
  ollama:
    image: ollama/ollama:latest
    container_name: llm-gateway-ollama
    network_mode: host
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 0"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  # LiteLLM Proxy - the main gateway
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: llm-gateway-litellm
    network_mode: host
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm}@127.0.0.1:5432/${POSTGRES_DB:-litellm}
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-master-key-change-me}
      LITELLM_LOG: "DEBUG"
      # Provider API keys (optional - leave empty for local-only mode)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      AZURE_API_BASE: ${AZURE_API_BASE:-}
      # Ollama connection
      OLLAMA_API_BASE: http://127.0.0.1:11434
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml:ro
      - ./guardrails:/app/guardrails:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Presidio Analyzer for PII detection
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: llm-gateway-presidio-analyzer
    network_mode: host
    environment:
      PORT: "5001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Presidio Anonymizer for PII redaction
  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: llm-gateway-presidio-anonymizer
    network_mode: host
    environment:
      PORT: "5002"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dashboard - lightweight observability UI
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: llm-gateway-dashboard
    network_mode: host
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm}@127.0.0.1:5432/${POSTGRES_DB:-litellm}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-master-key-change-me}
      LITELLM_URL: http://127.0.0.1:4000
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
