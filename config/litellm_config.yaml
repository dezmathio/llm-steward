# =============================================================================
# LiteLLM Gateway Configuration
# =============================================================================
# This config defines model routing, fallbacks, guardrails, and observability.
# Models are organized by capability tier for easy team assignment.

# -----------------------------------------------------------------------------
# Model Definitions
# -----------------------------------------------------------------------------
model_list:
  # ---------------------------------------------------------------------------
  # Local Models (Zero Cost - Always Available)
  # ---------------------------------------------------------------------------
  - model_name: local/small
    litellm_params:
      model: ollama/qwen2.5:0.5b
      api_base: http://ollama-cpu:11434
    model_info:
      description: "Small local model for testing and development"
      tier: "free"
      
  - model_name: local/medium
    litellm_params:
      model: ollama/qwen2.5:1.5b
      api_base: http://ollama-cpu:11434
    model_info:
      description: "Medium local model for general use"
      tier: "free"

  # ---------------------------------------------------------------------------
  # Stub/Fake Model (For Testing - No External Calls)
  # ---------------------------------------------------------------------------
  - model_name: fake/echo
    litellm_params:
      model: fake/echo
      mock_response: "This is a mock response from the gateway."
    model_info:
      description: "Fake model for testing - returns mock responses"
      tier: "free"

  # ---------------------------------------------------------------------------
  # OpenAI Models (Requires OPENAI_API_KEY)
  # ---------------------------------------------------------------------------
  - model_name: openai/gpt-4o
    litellm_params:
      model: gpt-4o
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      description: "OpenAI GPT-4o - fast and capable"
      tier: "standard"
      
  - model_name: openai/gpt-4o-mini
    litellm_params:
      model: gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      description: "OpenAI GPT-4o Mini - cost-effective"
      tier: "budget"

  - model_name: openai/gpt-4-turbo
    litellm_params:
      model: gpt-4-turbo
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      description: "OpenAI GPT-4 Turbo"
      tier: "premium"

  # ---------------------------------------------------------------------------
  # Anthropic Models (Requires ANTHROPIC_API_KEY)
  # ---------------------------------------------------------------------------
  - model_name: anthropic/claude-3-5-sonnet
    litellm_params:
      model: claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "Anthropic Claude 3.5 Sonnet"
      tier: "standard"

  - model_name: anthropic/claude-3-haiku
    litellm_params:
      model: claude-3-haiku-20240307
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "Anthropic Claude 3 Haiku - fast and affordable"
      tier: "budget"

  # ---------------------------------------------------------------------------
  # Fallback Chains
  # ---------------------------------------------------------------------------
  - model_name: smart
    litellm_params:
      model: openai/gpt-4o
    model_info:
      description: "Smart model with automatic fallback"
      tier: "standard"
      
  - model_name: fast
    litellm_params:
      model: openai/gpt-4o-mini
    model_info:
      description: "Fast model with automatic fallback"
      tier: "budget"

# -----------------------------------------------------------------------------
# Router Settings (Fallbacks & Load Balancing)
# -----------------------------------------------------------------------------
router_settings:
  routing_strategy: least-busy
  num_retries: 2
  timeout: 120
  retry_after: 5
  
  # Fallback chains: if primary fails, try alternatives
  fallbacks:
    - smart: [openai/gpt-4o, anthropic/claude-3-5-sonnet, local/medium]
    - fast: [openai/gpt-4o-mini, anthropic/claude-3-haiku, local/small]
    - openai/gpt-4o: [anthropic/claude-3-5-sonnet, local/medium]
    - openai/gpt-4o-mini: [anthropic/claude-3-haiku, local/small]

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  
  # Store configuration in database
  store_model_in_db: true
  
  # Enable spend tracking
  max_budget: 1000.0
  budget_duration: monthly

# -----------------------------------------------------------------------------
# Litellm Settings
# -----------------------------------------------------------------------------
litellm_settings:
  # Enable detailed logging
  set_verbose: true
  
  # Drop unmapped params to avoid errors
  drop_params: true
  
  # Cache settings
  cache: true
  cache_params:
    type: redis
    supported_call_types:
      - acompletion
      - completion
      
  # Callbacks for observability
  success_callback:
    - custom_callback_handler.log_success
  failure_callback:
    - custom_callback_handler.log_failure

# -----------------------------------------------------------------------------
# Guardrails Configuration
# -----------------------------------------------------------------------------
guardrails:
  - guardrail_name: pii-guardrail
    litellm_params:
      guardrail: presidio
      mode: during_call
      presidio_analyzer_api_base: http://presidio-analyzer:3000
      presidio_anonymizer_api_base: http://presidio-anonymizer:3000
      output_parse_pii: true
      pii_masking_strategy: redact
      # Entity types to detect
      pii_entities_to_detect:
        - PERSON
        - EMAIL_ADDRESS
        - PHONE_NUMBER
        - CREDIT_CARD
        - US_SSN
        - US_BANK_NUMBER
        - IP_ADDRESS
        - LOCATION
